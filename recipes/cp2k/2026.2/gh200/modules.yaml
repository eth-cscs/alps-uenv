modules:
  prefix_inspections:
    bin:
      - PATH
    lib:
      - LD_LIBRARY_PATH
    lib64:
      - LD_LIBRARY_PATH

  default:
    arch_folder: false
    tcl:
      all:
        autoload: none
      hash_length: 0
      exclude_implicits: true
      exclude: []
      projections:
        all: '{name}/{version}'
        gcc@15: '{name}/{version}'
