agents:
  compiler: [gcc]
  unify: true
  specs:
    - cscs-agent-model-config
    - cscs-agent-launchers@2026.08.28
    - shellcheck
    - jq
    - yq@4
    # Keep Stackinator's image packer alive across cleanup: runtime.
    - squashfs
  views:
    agents:
      link: roots
      uenv:
        add_compilers: false
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
