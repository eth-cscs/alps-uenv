gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@9.2.1 +cuda
  unify: true
  specs:
  - boost +chrono +filesystem +iostreams +mpi +program_options +python +regex +serialization +shared +system +timer
  - cmake
  - fftw
  - fmt
  - gmp
  - gsl
  - hdf5+cxx+hl+fortran
  - kokkos +aggressive_vectorization ~alloc_async cuda_arch=90 +cuda_constexpr ~cuda_relocatable_device_code cxxstd=20 +openmp +pic +serial +shared +tuning +wrapper
  - kokkos-kernels +blas +cublas +cusparse +cusolver +execspace_cuda +execspace_openmp +execspace_serial +lapack +memspace_cudaspace +openmp scalars=float,double,complex_float,complex_double +serial +shared +superlu
  - kokkos-tools +mpi +papi
  - netlib-scalapack
  - lua
  - libtree
  - lz4
  - meson
  - netcdf-c
  - netcdf-cxx
  - netcdf-cxx4
  - netcdf-fortran
  - ninja
  - openblas threads=openmp
  - osu-micro-benchmarks
  - papi
  - python
  - zlib-ng
  # add GPU-specific packages here, for easier comparison with mc version
  - nccl
  - nccl-tests
  - cuda
  - xcb-util-cursor
  - aws-ofi-nccl
  - superlu
  - cufftmp
  - nvshmem@3.8.0-0 +cuda +mpi +nccl ~ucx +libfabric +gpu_initiated_support
  variants:
  - +mpi
  - +cuda
  - cuda_arch=90a
  views:
    default:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
          - NVSHMEM_REMOTE_TRANSPORT: "libfabric"
          - NVSHMEM_LIBFABRIC_PROVIDER: "cxi"
          - NVSHMEM_DISABLE_CUDA_VMM: "1"
