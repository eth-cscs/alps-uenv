gcc-env:
  compiler: [gcc, llvm-amdgpu]
  network:
      mpi: cray-mpich@9.2.1+rocm
  unify: true
  specs:
  - boost@1.88.0 +chrono +filesystem +iostreams ~mpi +python +regex +serialization +shared +system +timer
  - cmake
  - fftw
  - fmt@12.1
  - gsl
  - hdf5+cxx+hl+fortran
  - netlib-scalapack
  - lua
  - libtree
  - lz4
  - meson
  - ninja
  - openblas threads=openmp
  - osu-micro-benchmarks ~xccl
  - python@3.12
  - zlib-ng
  # add GPU-specific packages here, for easier comparison with mc version
  - hip@7.14.0 ^mesa
  - hdf5+mpi
  - hipcub
  - llvm-amdgpu
  # rocm packages
  - rocblas +tensile
  - rocfft
  - rocm-cmake
  - rocm-core
  - rocminfo
  - rocprim
  - amdsmi
  - rocprofiler-dev
  - rocprofiler-sdk
  - rocprofiler-systems +internal-dyninst +rocm
  - rocprofiler-compute
  - rocrand
  - rocsolver
  - rocsparse
  - rocthrust
  - roctracer-dev-api
  - roctracer-dev
  - rocm-gdb
  - rocm-debug-agent
  - hsa-rocr-dev
  - comgr
  # hip packages
  - hipblas
  - hipblaslt
  - hiprand
  - hipsparse
  - hipsolver
  - hipfft
  - hipblas-common
  - hipdnn
  - miopen-hip
  # networking
  - rccl
  - aws-ofi-nccl~cuda
  - rccl-tests +mpi
  variants:
  - +mpi
  - +rocm
  - amdgpu_target=gfx942,gfx90a
  - amdgpu_target_sram_ecc=gfx942,gfx90a
  views:
    default:
      link: roots
      exclude: ["llvm"]
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
          - FI_PROVIDER: "cxi"
          - MPIR_CVAR_CH4_OFI_ENABLE_HMEM: "1"
