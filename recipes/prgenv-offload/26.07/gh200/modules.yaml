modules:
  # Paths to check when creating modules for all module sets
  prefix_inspections:
    bin:
      - PATH
    lib:
      - LD_LIBRARY_PATH
    lib64:
      - LD_LIBRARY_PATH

  default:
    arch_folder: false
    tcl:
      all:
        autoload: run
      hash_length: 0
      exclude_implicits: true
      hide_implicits: true
      projections:
        all: '{name}/{version}'
