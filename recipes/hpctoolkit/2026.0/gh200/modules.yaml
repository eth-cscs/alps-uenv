modules:
  # Paths to check when creating modules for all module sets
  prefix_inspections:
    bin:
      - PATH
    lib:
      - LD_LIBRARY_PATH
    lib/python3.11/site-packages:
      - PYTHONPATH

  default:
    arch_folder: false
    # Where to install modules
    tcl:
      all:
        autoload: run
      hash_length: 0
      exclude_implicits: true
      exclude: ['%gcc@7.5.0', 'gcc %gcc@7.5.0']
      projections:
        all: '{name}/{version}'
