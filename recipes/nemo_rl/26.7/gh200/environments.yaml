gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@9.1 +cuda
  unify: true
  specs:
  - boost +chrono +filesystem +iostreams +mpi +program_options +python +regex +serialization +shared +system +timer
  - cmake
  - fftw
  - fmt
  - gmp
  - gsl
  - hdf5+cxx+hl+fortran
  - lua
  - libtree
  - lz4
  - meson
  - ninja
  - openblas threads=openmp
  - osu-micro-benchmarks
  - papi
  - python
  - zlib-ng
  # add GPU-specific packages here, for easier comparison with mc version
  - nccl
  - nccl-tests
  - cuda
  - xcb-util-cursor
  - aws-ofi-nccl
  variants:
  - +mpi
  - +cuda
  - cuda_arch=90a
  views:
    default:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
