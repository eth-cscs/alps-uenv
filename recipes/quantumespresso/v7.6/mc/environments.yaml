gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@8.1.32
  unify: true
  specs:
    # current QE doesn't compile with gipaw
  - quantum-espresso@7.6 +libxc +oscdft +wannier90_external ~gipaw +scalapack +elpa +openmp hdf5=parallel
  - netlib-scalapack
  - wannier90
  - cmake
  - libxc
  - fftw
  - hdf5
  - openblas threads=openmp
  variants:
  - +mpi
  views:
    default:
      link: roots
    develop:
      exclude: ['quantum-espresso', 'patchelf', 'git']
      link: roots
