pytorch-env:
  compiler: [gcc, llvm]
  network:
    mpi: cray-mpich@9.1.0 +cuda
    specs:
      - xpmem@2.9.6 ~kernel-module
      - libfabric@2.7.0 +gdrcopy +uring fabrics=cxi,lnx,shm,rxm,sockets,tcp,udp
  unify: true
  specs:
  - boost +chrono +filesystem +iostreams +mpi +python +regex +serialization +shared +system +timer
  - cmake
  - fftw
  - fmt
  - gsl
  - hdf5+cxx+hl+fortran
  - lua
  - libtree
  - lz4
  - meson
  - netcdf-c
  - netcdf-cxx
  - netcdf-fortran
  - ninja
  - openblas threads=openmp
  - osu-micro-benchmarks
  - papi
  - zlib-ng
  - nccl@2.32.3-1
  - nccl-tests
  # PyTorch 2.13 pins MAGMA <=2.9, which is incompatible with CUDA 13.
  - cuda@13.3.0
  - cudnn
  - cutensor
  - cutlass
  - cublasmp@0.8.0.2023
  - nvidia-mathdx@25.06.1-cuda13
  - xcb-util-cursor
  - aws-ofi-nccl@1.21.1
  - nvshmem@3.7.2-0 ~ucx +nccl +gdrcopy +libfabric +mpi +python +gpu_initiated_support
  - libunwind@master +pic ~tests components=coredump,ptrace,setjmp +xz +zlib
  - hydra
  - swig
  - libaio
  - ucx +cma +dm ~examples +gdrcopy +thread_multiple +xpmem
  - ucc +nccl
  - rdma-core-mock ~ipo
  - faiss +python
  - python@3.12
  - python-venv
  - py-pip
  - py-pytest
  - py-cython
  - py-pybind11
  - py-cuda-python@13.3.1
  - py-cuda-bindings@13.3.1
  - py-cuda-core@1.0.1
  - py-cuda-pathfinder
  - py-numpy
  - py-torch@2.13.0 +caffe2 +cudnn +cusparselt +custom-protobuf +distributed ~fbgemm +flash_attention +gloo +kineto ~magma ~metal ~mkldnn +nccl +numa +numpy +openmp +qnnpack ~rocm +tensorpipe ~test ~ucc +valgrind +xnnpack
  - py-torchaudio@2.11.0
  - py-torchvision@0.28.0
  - py-torchmetrics
  - py-triton@3.7.1 +build-custom-llvm
  - py-torch-nvidia-apex
  - py-transformer-engine@2.19
  - py-einops
  - py-safetensors
  - py-tokenizers
  - py-transformers
  - py-ml-dtypes
  - py-onnx
  - py-onnx-ir
  - py-onnxscript
  - py-regex
  - py-tensorboard
  - py-psutil
  - dynolog +use-prometheus +with-unwind +with-gflags
  # Packages which do not compile with +ipo.
  - libjpeg-turbo ~ipo
  - libpng ~ipo
  - protobuf ~ipo
  variants:
  - +mpi
  - +cuda
  - cuda_arch=90a
  - +ipo
  views:
    pytorch:
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
          - CUDA_HOME: "/user-environment/env/pytorch"
          - CUDA_CACHE_DISABLE: "1"
          - MODULAR_CRASH_REPORTING_ENABLED: "0"
          - FI_CXI_DEFAULT_CQ_SIZE: "131072"
          - FI_CXI_DEFAULT_TX_SIZE: "16384"
          - FI_CXI_DISABLE_HOST_REGISTER: "1"
          - FI_CXI_RDZV_EAGER_SIZE: "0"
          - FI_CXI_RDZV_GET_MIN: "0"
          - FI_CXI_RDZV_PROTO: "alt_read"
          - FI_CXI_RDZV_THRESHOLD: "0"
          - FI_CXI_RX_MATCH_MODE: "hybrid"
          - FI_CXI_SAFE_DEVMEM_COPY_THRESHOLD: "16777216"
          - FI_MR_CACHE_MAX_COUNT: "524288"
          - FI_MR_CACHE_MAX_SIZE: "-1"
          - FI_MR_CACHE_MONITOR: "userfaultfd"
          - FI_PROVIDER: "cxi"
          - NCCL_CROSS_NIC: "0"
          - NCCL_NCHANNELS_PER_NET_PEER: "4"
          - NCCL_NET: "AWS Libfabric"
          - NCCL_NET_GDR_C2C: "1"
          - NCCL_NET_GDR_LEVEL: "PHB"
          - NCCL_NET_GDR_READ: "1"
          - NCCL_NSOCKS_PERTHREAD: "1"
          - NCCL_P2P_LEVEL: "NVL"
          - NCCL_PROTO: "^LL128"
          - NCCL_PXN_DISABLE: "1"
          - NCCL_SOCKET_IFNAME: "hsn"
          - NCCL_SOCKET_NTHREADS: "4"
          - NVSHMEM_DISABLE_CUDA_VMM: "1"
          - NVSHMEM_LIBFABRIC_PROVIDER: "cxi"
          - NVSHMEM_REMOTE_TRANSPORT: "libfabric"
          - PYTHONPATH: null
          - PYTHONUSERBASE: "/user-environment/env/pytorch"
